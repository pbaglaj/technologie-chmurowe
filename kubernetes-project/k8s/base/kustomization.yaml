apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: notes

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: notes

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - redis-service.yaml
  - redis-deployment.yaml
  - api-service.yaml
  - api-deployment.yaml
  - migration-job.yaml

images:
  - name: ghcr.io/example/notes-api
    newName: ghcr.io/example/notes-api
    newTag: latest
