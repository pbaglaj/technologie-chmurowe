apiVersion: batch/v1
kind: Job
metadata:
  name: notes-migrate
  labels:
    app.kubernetes.io/name: notes-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notes-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "waiting for postgres at $POSTGRES_HOST:$POSTGRES_PORT...";
              until nc -z "$POSTGRES_HOST" "$POSTGRES_PORT"; do
                sleep 2;
              done;
              echo "postgres reachable";
          envFrom:
            - configMapRef:
                name: notes-config
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      containers:
        - name: psql
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              set -e
              echo "applying migrations against $POSTGRES_HOST/$POSTGRES_DB as $POSTGRES_USER";
              for f in /migrations/*.sql; do
                echo "==> $f";
                PGPASSWORD="$POSTGRES_PASSWORD" psql \
                  -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" \
                  -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                  -v ON_ERROR_STOP=1 -f "$f";
              done;
              echo "migrations done";
          envFrom:
            - configMapRef:
                name: notes-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: notes-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notes-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: notes-migrations
